<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Dashio | Project OS</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4338ca" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e1e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Q-18: the font stylesheet is added by src/main.tsx after the first paint (it used to block every paint behind a second host on slow networks);
         the text shows in the system Arabic font and swaps once the font arrives (display=swap). -->
    <!-- Q-18: first paint. Before any script or stylesheet, the page is already the platform's background and the frame's shape in calm grey (no white
         screen, no accent colour). React replaces #root's contents when it mounts; the app then fades in once. Values are the light-theme tokens of
         src/index.css (paper #F5F7FC, white cards, line #E4E9F4); a static test keeps them equal. -->
    <style>
      html, body { margin: 0; background: #F5F7FC; color: #0C1023; font-family: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif; }
      .boot { display: flex; min-height: 100vh; flex-direction: column; }
      .boot-top { display: flex; height: 56px; align-items: center; gap: 12px; border-bottom: 1px solid #E4E9F4; background: #FFFFFF; padding: 0 12px; box-sizing: border-box; }
      .boot-top img { height: 26px; width: auto; }
      .boot-fill { flex: 1; }
      .boot-row { display: flex; flex: 1; }
      .boot-side { display: none; width: 240px; flex-shrink: 0; border-inline-end: 1px solid #E4E9F4; background: #FFFFFF; padding: 12px; box-sizing: border-box; }
      .boot-main { flex: 1; min-width: 0; padding: 20px 16px; box-sizing: border-box; }
      .boot-inner { margin: 0 auto; max-width: 1024px; display: flex; flex-direction: column; gap: 20px; }
      .boot-bar { display: block; border-radius: 8px; background: #E4E9F4; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-cards { display: grid; gap: 16px; }
      .boot-card { border: 1px solid #E4E9F4; border-radius: 14px; background: #FFFFFF; padding: 16px; }
      @media (min-width: 640px) { .boot-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (min-width: 768px) { .boot-side { display: block; } .boot-main { padding: 28px 32px; } .boot-top { padding: 0 16px; } }
      @keyframes boot-pulse { 50% { opacity: .55; } }
      @keyframes app-in { from { opacity: 0; } }
      #root > :not(.boot) { animation: app-in .18s ease-out; }
      @media (prefers-reduced-motion: reduce) { .boot-bar, #root > :not(.boot) { animation: none; } }
    </style>
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/appicon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>

  <body>
    <div id="root"><div class="boot" role="status" aria-busy="true" aria-label="Dashio">
      <div class="boot-top"><img src="/brand/logo-horizontal.svg" alt="Dashio" width="104" height="26" /><span class="boot-fill"></span><span class="boot-bar" style="width:36px;height:36px;border-radius:999px"></span></div>
      <div class="boot-row">
        <div class="boot-side"><span class="boot-bar" style="height:36px"></span><span class="boot-bar" style="height:36px;margin-top:8px"></span><span class="boot-bar" style="height:36px;margin-top:8px"></span><span class="boot-bar" style="height:36px;margin-top:8px"></span></div>
        <div class="boot-main"><div class="boot-inner">
          <span class="boot-bar" style="height:16px;width:160px"></span><span class="boot-bar" style="height:32px;width:256px;max-width:100%"></span>
          <div class="boot-cards"><div class="boot-card"><span class="boot-bar" style="height:12px;width:96px"></span><span class="boot-bar" style="height:28px;width:80px;margin-top:12px"></span></div><div class="boot-card"><span class="boot-bar" style="height:12px;width:96px"></span><span class="boot-bar" style="height:28px;width:80px;margin-top:12px"></span></div><div class="boot-card"><span class="boot-bar" style="height:12px;width:96px"></span><span class="boot-bar" style="height:28px;width:80px;margin-top:12px"></span></div></div>
          <div class="boot-card"><span class="boot-bar" style="height:16px"></span><span class="boot-bar" style="height:16px;width:75%;margin-top:16px"></span><span class="boot-bar" style="height:16px;margin-top:16px"></span></div>
        </div></div>
      </div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>

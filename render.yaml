# Render Blueprint for PROJECT OS: one Express server that serves the built
# client and the tRPC API, plus a daily cron job for license expiry and the monthly profit snapshots.
#
# Nothing here deploys by itself: autoDeploy is off, so a deploy is the owner
# pressing the button. Values marked `sync: false` are asked for in the Render
# dashboard (see docs/OWNER_ACTIONS.md); none is stored in this file.
services:
  - type: web
    name: project-os
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: false
    # NODE_ENV=production would make pnpm skip the dev dependencies the build needs.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    # Applies pending schema migrations before the new version takes traffic.
    preDeployCommand: node scripts/migrate.mjs
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Requests per minute allowed from one source address across /api (a person loading a screen sends about a dozen). Raise it for a large
      # office behind one address; sign-in has its own, lower limits.
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "600"
      - key: LLM_ENABLED
        value: "false"
      # E-mail notifications (escalations, what waits for your approval, the project manager's daily summary) stay off until this is "true"
      # AND RESEND_API_KEY and EMAIL_FROM are set. See docs/OWNER_ACTIONS.md.
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PROJECT_OS_APP_DB_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Optional: Google sign-in appears only when both are set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: the language model stays off unless all three are set.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false

  - type: cron
    name: project-os-license-expiry
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 2 * * *"
    buildCommand: "true"
    startCommand: 'curl --fail --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/scheduled/licenseExpiry" && curl --fail --silent --show-error --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/scheduled/profitabilitySnapshots"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: project-os
          envVarKey: CRON_SECRET
      - key: APP_BASE_URL
        fromService:
          type: web
          name: project-os
          envVarKey: APP_BASE_URL

  # Hourly: sends queued e-mail and, from 07:00 Riyadh, queues the day's reminders and summaries once. It does nothing while e-mail notifications are off.
  - type: cron
    name: project-os-email-notifications
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: 'curl --fail --silent --show-error --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/scheduled/emailNotifications"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: project-os
          envVarKey: CRON_SECRET
      - key: APP_BASE_URL
        fromService:
          type: web
          name: project-os
          envVarKey: APP_BASE_URL

  # Daily at 01:30 UTC: a logical backup of the database, gzip + AES-256-GCM encrypted, read back and verified, then uploaded to R2 under
  # backups/. TiDB Cloud Starter keeps only its own one-day snapshot on the free tier and has no point-in-time restore, so this is the copy that
  # survives a mistake noticed on day two. It FAILS (and Render shows the run as failed) when the key, the bucket or the database is missing:
  # a backup that quietly does nothing is worse than no job. See docs/OWNER_ACTIONS.md, section 4b.
  - type: cron
    name: project-os-backup
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "30 1 * * *"
    buildCommand: pnpm install --frozen-lockfile --prod=false
    startCommand: node --import tsx scripts/export-database.mjs --to-r2
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromService:
          type: web
          name: project-os
          envVarKey: DATABASE_URL
      # Optional and better: an account that can only SELECT. When set, it is used instead of DATABASE_URL.
      - key: BACKUP_DATABASE_URL
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: project-os
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: project-os
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: project-os
          envVarKey: R2_SECRET_ACCESS_KEY

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>contrast negative control</title>
<style>
  /* Negative control for scripts/check-contrast.mjs: each "bad" item below is under its threshold and must be reported; each "good" one must not. */
  body { background: #ffffff; font: 16px sans-serif; }
  .bad-text { color: #9ca3af; }            /* 2.54:1 on white — under 4.5 */
  .good-text { color: #374151; }           /* 10.3:1 */
  .bad-field { border: 1px solid #e5e7eb; } /* 1.24:1 — under 3 */
  .good-field { border: 1px solid #6b7280; }
  .bad-icon { color: #d1d5db; border: 0; background: none; } /* icon-only button, 1.47:1 */
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #fde68a; } /* status dot, 1.4:1 */
  .muted { color: #9ca3af; }
</style></head>
<body><main><h1>فحص سلبي</h1>
<p class="bad-text">نص باهت تحت الحد</p>
<p class="good-text">نص واضح</p>
<input class="bad-field" aria-label="حقل باهت"><input class="good-field" aria-label="حقل واضح">
<button class="bad-icon" aria-label="إغلاق"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2 14 14" stroke="currentColor" stroke-width="2"/></svg></button>
<span class="dot"></span>
<button disabled class="muted">زر معطّل مستثنى</button>
</main></body></html>

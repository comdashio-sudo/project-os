name: Migrate and promote production

# Automatic, after every green CI run on main (and by hand). The ORDER is the safety: the database first, the site last, and the site only if everything before it passed.
#   1. migrations are checked for backward compatibility (expand, then contract): the release still serving traffic must keep working on the migrated schema;
#   2. the migrations are applied to the production database, then verify-db-security proves the restricted application role (the result is written in the summary);
#   3. the release candidate is BUILT HERE and started against that migrated database as the restricted role: /healthz 200, a wrong sign-in code answers 4xx (never 5xx), /api/readyz lists no pending migration;
#      with no publishable key in the repository (D-69) the sign-in check is replaced by the public tRPC procedure system.health (200, ok=true): without a key that check answers 503 by design;
#   4b. only then is production deployed from here with the Vercel CLI (D-78): vercel pull, vercel build --prod, vercel deploy --prebuilt --prod --skip-domain (a production
#      deployment the production domains do NOT point to yet). No Vercel setting is needed (the
#      dashboard's Production Branch can stay main; scripts/ci/vercel-ignore.sh still refuses a production build of main from git, and an Ignored Build Step does not apply to a
#      --prebuilt deployment, which has no build on Vercel to skip);
#   5. vercel inspect proves the new deployment is READY with target production and scripts/ci/post-deploy-check.mjs checks its own address (a failure here changes nothing);
#      then vercel promote, then vercel inspect of the production address is asked until it names the new deployment, and the same check runs on the production address. A failure
#      after the promotion rolls production back (vercel rollback to the deployment that served before 4b) and fails the run. The explicit promote also restores the automatic
#      domain assignment that any earlier rollback turned off;
#   6. last, the `production` branch is fast-forwarded to this commit (never a force-push). It records what production serves: the "What would ship" diff is taken against it, so it moves
#      only after production is verified, and a failed deployment is retried by the next run.
# Any failure stops the run before the next step. A failure before the promotion in 5 changes nothing on the site; a failure after it rolls it back. The .vercel/ folder (vercel pull writes the production
# environment there) is deleted by the last step, whatever happened.
# Secrets: SUPABASE_DB_PASSWORD and VERCEL_TOKEN (checked with vercel whoami before any migration; it is passed to the CLI through the environment, never on a command line, never printed),
# optional VERCEL_AUTOMATION_BYPASS_SECRET. Variables (optional): SUPABASE_POOLER_HOST (pins the session-pooler host; otherwise it is found by trying), VERCEL_TEAM_ID, VERCEL_PROJECT_ID
# and PRODUCTION_URL (defaults below, the same as post-deploy.yml). The project URL and its PUBLIC publishable key (sb_publishable_, optional since D-69: it adds the sign-in check) are
# read from config/supabase.public.json in the repository, never from a GitHub variable (D-35); a secret key there is refused by scripts/ci/public-config-check.sh and by
# server/testing/supabasePublicConfig.test.ts. The order of the steps is held by server/testing/releaseWorkflow.test.ts.
# It starts when CI on main has FINISHED GREEN for the commit (workflow_run), not on the push itself: the heavy checks (unit tests, database suite,
# screenshots, the three journeys) run once on main and nothing is migrated or promoted before they pass (owner's decision, 2026-10-27). A CI run cancelled
# by a newer merge releases nothing; the newer commit's run does. By hand (workflow_dispatch) it releases main's newest commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  release:
    name: migrate, prove, promote
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      GH_TOKEN: ${{ github.token }}
      # the same team and project as post-deploy.yml; the Vercel CLI reads these two names (no link file is committed)
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID || 'team_DDgIiaktQp5KcMWBYSnBPxEf' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_z9rRP8H1AzWS5ElYIZMtJn12sgZM' }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://dashio-lovat.vercel.app' }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the commit CI just proved, not whatever main is now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: What would ship (a change to documentation or workflows only needs nothing)
        id: scope
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # the checkout above is full history (fetch-depth: 0); production is fetched again so the ancestry check and the diff see its current tip
          if git ls-remote --exit-code --heads origin production >/dev/null 2>&1; then
            git fetch -q origin production
            base="origin/production"
            git merge-base --is-ancestor "$base" "$sha" || { echo "::error::the production branch is not an ancestor of $sha, so it cannot be fast-forwarded. Do not force-push: merge production into main."; exit 1; }
            changed="$(git diff --name-only "$base" "$sha")"
          else
            changed="(no production branch yet)"
          fi
          # the decision is a script with tests (scripts/ci/release-scope.sh): a pipeline into `grep -q` here once read a 209-file code diff as "nothing to ship" (D-57)
          decision="$(printf '%s\n' "$changed" | bash scripts/ci/release-scope.sh)"
          echo "$decision" >> "$GITHUB_OUTPUT"
          echo "changed paths: $(printf '%s\n' "$changed" | grep -c . || true); $decision"
          if [ "$decision" = "deploy=false" ]; then
            echo "### Nothing to ship" >> "$GITHUB_STEP_SUMMARY"; echo "Only documentation or workflow files differ from production; no migration, no deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.deploy == 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install (and the Vercel CLI, pinned)
        if: steps.scope.outputs.deploy == 'true'
        run: |
          pnpm install --frozen-lockfile
          npm install -g vercel@65.2.0
      - name: Refuse to start without the secrets, with a rejected VERCEL_TOKEN or with a non-public Supabase key
        id: config
        if: steps.scope.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::the repository secret SUPABASE_DB_PASSWORD is not set (docs/GO_LIVE.md, automatic release)"; exit 1; }
          # D-78: the token deploys production in step 4b, so it is proven BEFORE any migration. The CLI reads it from the environment; the value is never on a command line.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::the repository secret VERCEL_TOKEN is not set (docs/GO_LIVE.md): production is deployed with it after the migrations"; exit 1
          fi
          if ! who="$(vercel whoami 2>&1)"; then
            echo "::error title=VERCEL_TOKEN rejected::vercel whoami failed, so nothing was migrated or deployed. Create a new token (Vercel -> Account Settings -> Tokens) and replace the repository secret VERCEL_TOKEN. The CLI said:"
            printf '%s\n' "$who" | tail -n 5 | cut -c1-300
            exit 1
          fi
          echo "Vercel token accepted (vercel whoami)"
          # url required; publishableKey empty = has_key=false (step 3 runs without the sign-in check); anything but sb_publishable_ fails (D-69)
          bash scripts/ci/public-config-check.sh config/supabase.public.json >> "$GITHUB_OUTPUT"
      - name: 1. Migrations are backward compatible
        if: steps.scope.outputs.deploy == 'true'
        run: node scripts/ci/check-migration-compat.mjs
      - name: Database connection (the password alone)
        if: steps.scope.outputs.deploy == 'true'
        env:
          BOOTSTRAP_STATE: ${{ runner.temp }}/release-state.json
        run: node --import tsx scripts/bootstrap/run.ts direct
      - name: 2. Apply the migrations and prove the restricted role
        if: steps.scope.outputs.deploy == 'true'
        run: |
          set -o pipefail
          node --import tsx scripts/predeploy.mjs 2>&1 | tee "$RUNNER_TEMP/migrate.log"
      - name: 2b. verify-db-security (read-only)
        if: steps.scope.outputs.deploy == 'true'
        run: |
          set -o pipefail
          node --import tsx scripts/verify-db-security.mjs 2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: 3. Build the release candidate and run it against the migrated database
        if: steps.scope.outputs.deploy == 'true'
        env:
          NODE_ENV: production
          PORT: "3920"
          DATABASE_POOL_MAX: "2"
          EMAIL_NOTIFICATIONS_ENABLED: "false"
        run: |
          set -euo pipefail
          NODE_ENV=development pnpm build
          export DATABASE_URL="$RELEASE_GATE_DATABASE_URL"
          jwt="$(openssl rand -hex 32)"
          export JWT_SECRET="$jwt"
          # the public URL and publishable key from the repository (D-35); the server sends the key in the apikey header only.
          # No key (D-69): SUPABASE_ANON_KEY is not exported at all (never empty), and the check runs --without-sign-in.
          SUPABASE_URL="$(jq -r '.url' config/supabase.public.json)"
          export SUPABASE_URL
          gate_args=()
          if [ "${{ steps.config.outputs.has_key }}" = "true" ]; then
            SUPABASE_ANON_KEY="$(jq -r '.publishableKey' config/supabase.public.json)"
            export SUPABASE_ANON_KEY
          else
            gate_args=(--without-sign-in)
            echo "::notice::config/supabase.public.json has no publishable key: the release check uses system.health instead of the sign-in check (D-69)"
          fi
          node dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:3920/healthz" >/dev/null 2>&1 && break; sleep 2; done
          set +e
          node scripts/ci/post-deploy-check.mjs "http://127.0.0.1:3920" "${gate_args[@]}" 2>&1 | tee "$RUNNER_TEMP/gate.log"
          status=${PIPESTATUS[0]}
          set -e
          # the same check also WARNS (does not fail) on pending migrations; here that is a failure: step 2 has just applied them all
          if grep -q "migrations pending\|schema behind" "$RUNNER_TEMP/gate.log"; then echo "::error::the migrated database still lacks migrations the release names"; status=1; fi
          [ "$status" -eq 0 ] || { echo "--- server log (tail, no secrets) ---"; tail -n 20 "$RUNNER_TEMP/server.log" | cut -c1-300; exit 1; }
      - name: 4b. Deploy production (Vercel CLI, --skip-domain so production does not move yet)
        id: deploy
        if: steps.scope.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # what production serves now: step 5 rolls back to it if the promoted deployment fails (empty on the very first deployment)
          previous="$(vercel inspect "${PRODUCTION_URL#https://}" --json 2>/dev/null | jq -r '.id // empty' || true)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "production before this release: ${previous:-(none found)}"
          # the production environment of the Vercel project is written under .vercel/ (deleted by the last step, never uploaded as an artifact)
          vercel pull --yes --environment=production
          vercel build --prod
          # --skip-domain: a production deployment that is NOT aliased to the production domains; step 5 checks it, then promotes it. So any failure from here
          # to the promotion (no address printed, not READY, a failed check) leaves production exactly as it was, with nothing to roll back.
          vercel deploy --prebuilt --prod --skip-domain > "$RUNNER_TEMP/deploy.out"
          url="$(grep -Eo 'https://[^[:space:]]+' "$RUNNER_TEMP/deploy.out" | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy did not print a deployment address; production was not changed (--skip-domain)"; exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed (not yet serving production): $url"
      - name: 5. Check the new deployment, promote it, prove production serves it (roll back on failure)
        id: verify
        if: steps.scope.outputs.deploy == 'true'
        # NOT GitHub's default `bash -e {0}`: a failing check must reach the handler on the next line, not end the step there (QA on #231)
        shell: bash --noprofile --norc {0}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
          HAS_KEY: ${{ steps.config.outputs.has_key }}
          PROMOTE_WAIT_SECONDS: "300"
        run: |
          set -uo pipefail
          # post-deploy.yml is not relied on: a CLI deployment may create no GitHub deployment_status for it to react to
          # before the promotion production is untouched: stop, nothing to undo
          fail() {
            echo "::error title=Not promoted::$1. Production was not changed."
            exit 1
          }
          # after the promotion: back to what served before step 4b
          roll_back() {
            echo "::error title=Production check failed::$1"
            if [ -n "$PREVIOUS" ]; then
              if vercel rollback "$PREVIOUS" --yes; then echo "::warning title=Production rolled back::to deployment $PREVIOUS"; echo "rolled_back=$PREVIOUS" >> "$GITHUB_OUTPUT"
              else echo "::error title=Rollback failed::use Vercel -> Deployments -> the previous one -> Instant Rollback"; fi
            else
              echo "::error title=No automatic rollback::no previous production deployment was recorded in step 4b; use Vercel -> Deployments -> Instant Rollback"
            fi
            exit 1
          }
          check_args=()
          [ "$HAS_KEY" = "true" ] || check_args=(--without-sign-in)
          # 1) the new deployment is READY and is a production deployment
          info="$(vercel inspect "$DEPLOY_URL" --wait --timeout 5m --json 2>/dev/null)" || fail "vercel inspect could not read $DEPLOY_URL"
          new_id="$(jq -r '.id // empty' <<<"$info")"
          state="$(jq -r '.readyState // empty' <<<"$info")"
          target="$(jq -r '.target // empty' <<<"$info")"
          echo "deployment $DEPLOY_URL: id=$new_id state=$state target=$target"
          if [ -z "$new_id" ] || [ "$state" != "READY" ] || [ "$target" != "production" ]; then fail "$DEPLOY_URL is id=$new_id state=$state target=$target, not a READY production deployment"; fi
          # 2) the post-deploy check on the deployment's own address, before it serves anyone
          node scripts/ci/post-deploy-check.mjs "$DEPLOY_URL" "${check_args[@]}" 2>&1 | tee "$RUNNER_TEMP/deployment.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # a deployment address behind Vercel's protection answers 401/403 without the bypass secret: that is "cannot check here", not "broken";
            # the same check then runs on the production address after the promotion, with the rollback behind it
            if [ -z "$BYPASS_SECRET" ] && grep -Eq '^healthz: (401|403)$' "$RUNNER_TEMP/deployment.log"; then
              echo "::notice::$DEPLOY_URL is protected and VERCEL_AUTOMATION_BYPASS_SECRET is not set: checked after the promotion only"
            else
              fail "the post-deploy check of $DEPLOY_URL failed"
            fi
          fi
          # 3) promote it (this also restores the automatic domain assignment a past rollback turned off)
          vercel promote "$new_id" --yes || roll_back "vercel promote $new_id failed"
          # 4) the production address serves THIS deployment (no fixed sleep: ask until it does or the time is up)
          served=""
          deadline=$((SECONDS + PROMOTE_WAIT_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            served="$(vercel inspect "${PRODUCTION_URL#https://}" --json 2>/dev/null | jq -r '.id // empty')"
            if [ "$served" = "$new_id" ]; then break; fi
            sleep 10
          done
          echo "production $PRODUCTION_URL serves: ${served:-(unknown)}"
          if [ "$served" != "$new_id" ]; then roll_back "$PRODUCTION_URL still serves ${served:-an unknown deployment}, not $new_id, ${PROMOTE_WAIT_SECONDS}s after the promotion"; fi
          # 5) the same check on the production address
          node scripts/ci/post-deploy-check.mjs "$PRODUCTION_URL" "${check_args[@]}" 2>&1 | tee "$RUNNER_TEMP/production.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then roll_back "the post-deploy check of $PRODUCTION_URL failed"; fi
          echo "Production $PRODUCTION_URL serves ${{ steps.scope.outputs.sha }} (deployment $new_id, $DEPLOY_URL) and passed the post-deploy check." >> "$GITHUB_STEP_SUMMARY"
      - name: 6. Promote (fast-forward the production branch to what production now serves; never a force-push)
        id: promote
        if: steps.scope.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          sha="${{ steps.scope.outputs.sha }}"
          git push origin "$sha:refs/heads/production"
          echo "promoted=$sha" >> "$GITHUB_OUTPUT"
      - name: Summary (no secrets)
        if: always() && steps.scope.outputs.deploy == 'true'
        run: |
          {
            echo "## Release ${{ steps.scope.outputs.sha }}"
            echo "### Migrations"; echo '```'; tail -n 4 "$RUNNER_TEMP/migrate.log" 2>/dev/null | cut -c1-400 || echo "(did not run)"; echo '```'
            echo "### verify-db-security"; echo '```'; tail -n 3 "$RUNNER_TEMP/verify.log" 2>/dev/null | cut -c1-400 || echo "(did not run)"; echo '```'
            echo "### Release check (healthz, wrong sign-in code is 4xx or system.health without a key, readyz)"; echo '```'; cut -c1-300 < "$RUNNER_TEMP/gate.log" 2>/dev/null || echo "(did not run)"; echo '```'
            echo "### Production deployment (Vercel CLI)"; echo "${{ steps.deploy.outputs.url && format('deployed {0} (serves production only if step 5 promoted it)', steps.deploy.outputs.url) || 'NOT deployed: a step before it failed, the site stays on the previous release' }}"
            echo "${{ steps.verify.outputs.rolled_back && format('ROLLED BACK to {0}: the new deployment failed its check', steps.verify.outputs.rolled_back) || '' }}"
            echo "### Check of the new deployment, before the promotion"; echo '```'; cut -c1-300 < "$RUNNER_TEMP/deployment.log" 2>/dev/null || echo "(did not run)"; echo '```'
            echo "### Production check, after the promotion"; echo '```'; cut -c1-300 < "$RUNNER_TEMP/production.log" 2>/dev/null || echo "(did not run)"; echo '```'
            echo "### Promotion"; echo "${{ steps.promote.outputs.promoted && format('production branch moved to {0}', steps.promote.outputs.promoted) || 'production branch NOT moved: a step before it failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete .vercel/ (the pulled production environment), whatever happened
        if: always()
        run: rm -rf .vercel

name: CI

# The `gate` job needs no database and no secrets (the live suites skip by design, see server/testing/databaseGuard.setup.ts). The `database` job
# runs them against a throw-away PostgreSQL service container: the schema is built from the migrations, the tests run as the restricted
# application role (so row-level security is exercised), and the passwords below belong to that container alone.
# The `ui-screenshots` job builds the app on its own throw-away PostgreSQL, seeds the synthetic demo tenant, runs tests/ui/audit.mjs
# (1280px and 390px, Arabic) and uploads the screenshots as the `ui-screenshots-390-1280-ar` artifact. It fails on a hard audit failure.
# Actions are a rationed resource (owner's decision, 2026-10-27, after the plan's minutes ran out; before that, work order 20 item 11). So:
#  - a pull request runs ONLY the light checks: `pnpm check`, the secret scan, actionlint and the migration check (about 4 billed minutes).
#    The full test suite, the database suite, the screenshots and the journeys are run LOCALLY before every push (CLAUDE.md section 7);
#  - the heavy jobs (build and unit tests, database suite, screenshots in the three languages, the three end-to-end journeys) run ONCE on main,
#    after the squash lands (push), and on demand (workflow_dispatch). Promotion to production (promote-production.yml) refuses a commit of
#    main that has no successful run here, so nothing reaches production without them, and they are not run a second time;
#  - no daily scheduled run; a newer run on the same branch cancels the older one; every job has a time limit.
on:
  # Only pull requests run the light gate, and only a push to main runs the heavy jobs, so one change never runs twice. A change that touches
  # documentation alone (docs/ and Markdown files) starts no run at all; a change that touches any code still runs, documentation included.
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Every migration from 0016 on must be backward compatible (expand, then contract): the automatic release applies it while the previous release still serves traffic.
      # A light check, so it runs on pull requests too.
      - run: node scripts/ci/check-migration-compat.mjs
      # On a pull request the build and the unit tests were run locally before the push; they run here once main has the change.
      - if: github.event_name != 'pull_request'
        run: pnpm build
      - if: github.event_name != 'pull_request'
        run: pnpm test

  database:
    name: database suite (PostgreSQL)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway-postgres # secret-scan:allow container-local throw-away value
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations, restricted role, then every database suite
        run: node scripts/run-integration-database-test.mjs
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway-postgres@127.0.0.1:5432/postgres # secret-scan:allow container-local throw-away value
      - name: Database security proof (audit trail, row-level security, Data API roles)
        run: node --import tsx scripts/verify-db-security.mjs
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway-postgres@127.0.0.1:5432/project_os_integration_test # secret-scan:allow container-local throw-away value
          PROJECT_OS_APP_DB_PASSWORD: project-os-local-test-only # secret-scan:allow the local-only password setup-integration-test-db.mjs gives the role

  ui-screenshots:
    name: ui screenshots (390px and 1280px, ${{ matrix.label }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: ar, label: Arabic }
          - { language: en, label: English }
          - { language: ur, label: Urdu }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway-postgres # secret-scan:allow container-local throw-away value
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema from the migrations, restricted application role
        run: node scripts/setup-integration-test-db.mjs
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway-postgres@127.0.0.1:5432/postgres # secret-scan:allow container-local throw-away value
      # Work order 15: the screenshots are taken on the demonstration company "شركة العرض" (500 villas, three months of history), not on an empty shell,
      # so a cut-off number, an overflowing table or a wrong direction shows up where the owner will look. The same script the owner's button runs.
      - name: Demonstration company into the empty database
        run: |
          JWT_SECRET="$(openssl rand -hex 32)" DEMO_CONFIRM=yes node --import tsx scripts/demo/seed-demo-company.mjs seed > "$RUNNER_TEMP/seed.out"
          node -e '
            const fs = require("node:fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").trim().split("\n");
            const seed = JSON.parse(lines[lines.length - 1]);
            if (!seed.seeded || !seed.tenantId || !seed.projectId) throw new Error("the seed reported no tenant or project");
            fs.appendFileSync(process.env.GITHUB_ENV, "TENANT_ID=" + seed.tenantId + "\nPROJECT_ID=" + seed.projectId + "\n");
          ' "$RUNNER_TEMP/seed.out"
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway-postgres@127.0.0.1:5432/project_os_integration_test # secret-scan:allow container-local throw-away value
      - name: Production build
        run: pnpm build
      - name: Throw-away session secret (this run only)
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Production server on 127.0.0.1:3200
        run: |
          nohup node dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 < /dev/null &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3200/healthz; then
              echo "server answered"
              exit 0
            fi
            sleep 2
          done
          echo "server did not answer within two minutes"
          exit 1
        env:
          NODE_ENV: production
          PORT: "3200"
          DATABASE_URL: postgres://project_os_app:project-os-local-test-only@127.0.0.1:5432/project_os_integration_test # secret-scan:allow the local-only password setup-integration-test-db.mjs gives the role
      - name: Demo administrator session (token to a protected file outside the repo)
        run: node --import tsx tests/ui/mintSession.mjs "$RUNNER_TEMP/ui-session"
        env:
          DATABASE_URL: postgres://project_os_app:project-os-local-test-only@127.0.0.1:5432/project_os_integration_test # secret-scan:allow the local-only password setup-integration-test-db.mjs gives the role
      - name: Playwright and Chromium (pinned version, installed outside the repo)
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          chromium="$(node -p "require('$RUNNER_TEMP/playwright/node_modules/playwright').chromium.executablePath()")"
          test -x "$chromium"
          echo "PLAYWRIGHT_MODULE_DIR=$RUNNER_TEMP/playwright/node_modules/" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CHROMIUM=$chromium" >> "$GITHUB_ENV"
      - name: UI audit (1280px and 390px, ${{ matrix.label }}, synthetic demo tenant)
        run: node tests/ui/audit.mjs
        env:
          AUDIT_LANGUAGE: ${{ matrix.language }}
          BASE_URL: http://127.0.0.1:3200
          SESSION_FILE: ${{ runner.temp }}/ui-session
          OUT_DIR: ${{ runner.temp }}/ui-screenshots
      # Work order 20, item 14 (audit 6.7): an automatic accessibility check (axe-core, WCAG 2.x A/AA and best practice) over every screen at desktop and phone width, in Arabic.
      # axe-core is MPL-2.0 (file-level copyleft, no restriction on commercial use) and is used here unmodified as a test tool installed outside the repository; it never ships.
      # A CRITICAL violation fails the run; serious ones are listed. An automatic check finds roughly a third of real problems: a pass is "none axe can detect", not "accessible".
      - name: Accessibility check (axe-core, Arabic, every screen)
        if: matrix.language == 'ar'
        run: |
          npm install --prefix "$RUNNER_TEMP/axe" --no-save --no-audit --no-fund axe-core@4.10.2
          node --import tsx scripts/check-accessibility.mjs
        env:
          AXE_MODULE_DIR: ${{ runner.temp }}/axe/node_modules/
          BASE_URL: http://127.0.0.1:3200
          # the script finds the demo company and its owner by reading across companies, which the restricted application role may not do: it connects as the container's owner
          DATABASE_URL: postgres://postgres:ci-throwaway-postgres@127.0.0.1:5432/project_os_integration_test # secret-scan:allow container-local throw-away value
      - name: Server log (only after a failed step; the server logger prints a closed set of fields)
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/server.log" ]; then
            tail -n 80 "$RUNNER_TEMP/server.log" | sed -e "s/${JWT_SECRET:-no-secret-set}/[redacted]/g" -e 's#postgres://[^[:space:]]*#[redacted-url]#g'
          fi
      - name: Upload the screenshots and audit.json (kept 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-390-1280-${{ matrix.language }}
          path: ${{ runner.temp }}/ui-screenshots
          if-no-files-found: warn
          retention-days: 14
  demo-journeys:
    # Work order 17, item 5: the three journeys through the demonstration company (scripts/e2e-demo-journey.mjs) run once on main after every merge, in a real browser, as the people who would
    # do them and with the numbers checked at every level: (1) daily report -> approval -> progress, (2) submittal -> reply A -> inspection -> acceptance, (3) material issue ->
    # actual cost -> EVM -> expected profit on the board's dashboard. The script builds the demonstration company itself, starts the production build as the restricted role,
    # and removes the company at the end.
    name: demo journeys (3 end-to-end journeys)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway-postgres # secret-scan:allow container-local throw-away value
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema from the migrations, restricted application role
        run: node scripts/setup-integration-test-db.mjs
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway-postgres@127.0.0.1:5432/postgres # secret-scan:allow container-local throw-away value
      - name: Production build
        run: pnpm build
      - name: Playwright and Chromium (pinned version, installed outside the repo)
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          chromium="$(node -p "require('$RUNNER_TEMP/playwright/node_modules/playwright').chromium.executablePath()")"
          test -x "$chromium"
          echo "PLAYWRIGHT_MODULE_DIR=$RUNNER_TEMP/playwright/node_modules/" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CHROMIUM=$chromium" >> "$GITHUB_ENV"
      - name: The three journeys
        run: |
          set -o pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          JWT_SECRET="$secret" node --import tsx scripts/e2e-demo-journey.mjs | tee "$RUNNER_TEMP/journeys.out"
          {
            echo "## Demo journeys"
            grep -E '^(ok|FAIL) ' "$RUNNER_TEMP/journeys.out" | sed -e 's/^ok   /- ✅ /' -e 's/^FAIL /- ❌ /'
            tail -n 1 "$RUNNER_TEMP/journeys.out"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway-postgres@127.0.0.1:5432/project_os_integration_test # secret-scan:allow container-local throw-away value
          SERVER_DATABASE_URL: postgres://project_os_app:project-os-local-test-only@127.0.0.1:5432/project_os_integration_test # secret-scan:allow the local-only password setup-integration-test-db.mjs gives the role
          OUT_DIR: ${{ runner.temp }}/demo-journey-out
      - name: Upload the journey screenshots (kept 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-journey-screenshots
          path: ${{ runner.temp }}/demo-journey-out
          if-no-files-found: warn
          retention-days: 14
  workflows:
    name: workflow syntax (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # A workflow file GitHub rejects does not fail one job: it shows a failed run with no jobs on EVERY push (bootstrap.yml did, for a `runner` context in a job-level env).
      - name: actionlint (pinned release)
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/*.yml

  schema-migration:
    name: structure change comes with a migration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A baseline (drizzle/0000_baseline.sql, drizzle/baseline-security.sql) that changed without a numbered migration is a change no existing database would ever receive.
      - run: node scripts/check-schema-migration.mjs "origin/${{ github.base_ref }}"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Added lines on a pull request
        if: github.event_name == 'pull_request'
        run: node scripts/scan-secrets.mjs --diff "origin/${{ github.base_ref }}"
      - name: Whole tree
        run: node scripts/scan-secrets.mjs --all

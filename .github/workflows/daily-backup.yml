name: Daily backup

# Every day, and by hand (Actions <- Daily backup <- Run workflow). The free Supabase plan keeps no backups of its own, so this takes them:
#   pg_dump (version 17, the server's) of the schemas public + drizzle + auth + storage in ONE snapshot, plus every file in the storage buckets,
#   encrypted with gpg (AES-256), kept as a GitHub artifact for 90 days (the longest GitHub allows; the repository's own setting can only shorten it),
#   and the restore PROVEN in the same run: the dump is decrypted again, restored into a scratch PostgreSQL 17 that lives only inside this job, and the exact
#   row count of every table is compared with the count taken in the dump's snapshot. A restore that does not reproduce the data turns the run red AFTER the
#   encrypted files are uploaded, so the evidence is kept.
# Secrets (Settings <- Secrets and variables <- Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, STORAGE_S3_ACCESS_KEY_ID, STORAGE_S3_SECRET_ACCESS_KEY (the ones the
# launch button already uses) and ONE new one: BACKUP_ENCRYPTION_PASSPHRASE (docs/OWNER_ACTIONS.md says how to make it; without it the run stops before touching anything).
# How to read a backup back: docs/BACKUP_RESTORE.md.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    name: backup and prove the restore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ORGANIZATION_SLUG: ${{ vars.SUPABASE_ORGANIZATION_SLUG }}
      STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
      STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_RESTORE_ADMIN_URL: postgresql://postgres@localhost:5433/postgres
    steps:
      - name: Refuse to run without the secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STORAGE_S3_ACCESS_KEY_ID STORAGE_S3_SECRET_ACCESS_KEY BACKUP_ENCRYPTION_PASSPHRASE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (Settings > Secrets and variables > Actions). BACKUP_ENCRYPTION_PASSPHRASE: see docs/OWNER_ACTIONS.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: State file path
        run: echo "BOOTSTRAP_STATE=$RUNNER_TEMP/bootstrap-state.json" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 17 client (pg_dump must be at least as new as the server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: The one project's connection (refuses any other project)
        run: node --import tsx scripts/bootstrap/run.ts database
      - name: Back up, encrypt, restore, compare
        env:
          BACKUP_OUT: ${{ runner.temp }}/backup-out
        run: node scripts/backup/backup.mjs
      - name: Name of the artifact
        if: ${{ always() }}
        id: stamp
        run: echo "name=backup-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
      - name: Keep the encrypted files outside Supabase (90 days)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: |
            ${{ runner.temp }}/backup-out/*.gpg
            ${{ runner.temp }}/backup-out/manifest.json
          if-no-files-found: error
          retention-days: 90
